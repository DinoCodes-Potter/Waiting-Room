name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "WaitingRoom-*.dmg"
      - ".github/workflows/pages.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage the download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Prefer the newest GitHub Release; fall back to a DMG committed in the repo.
          mkdir -p release
          if gh release download --repo "${{ github.repository }}" --pattern 'WaitingRoom-*.dmg' --dir release 2>/dev/null; then
            dmg="$(ls release/WaitingRoom-*.dmg | sort -V | tail -n 1)"
          else
            dmg="$(ls WaitingRoom-*.dmg | sort -V | tail -n 1)"
          fi
          version="$(basename "$dmg")"
          version="${version#WaitingRoom-}"
          version="${version%.dmg}"
          mkdir -p website/download
          cp "$dmg" website/download/WaitingRoom.dmg
          sha="$(sha256sum "$dmg" | cut -d' ' -f1)"
          bytes="$(stat -c %s "$dmg")"
          printf '{"version":"%s","sha256":"%s","bytes":%s}\n' "$version" "$sha" "$bytes" > website/download/meta.json
          cat website/download/meta.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - id: deployment
        uses: actions/deploy-pages@v4

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2"
        required: true

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the app and DMG
        run: scripts/make-dmg.sh "${{ inputs.version }}"
      - name: Check the bundle
        run: |
          codesign --verify --deep --strict "dist/Waiting Room.app"
          plutil -p "dist/Waiting Room.app/Contents/Info.plist" | grep -E "Identifier|Version"
          lipo -info "dist/Waiting Room.app/Contents/MacOS/WaitingRoom"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" "dist/WaitingRoom-${{ inputs.version }}.dmg" \
            --title "Waiting Room ${{ inputs.version }}" \
            --notes-file <(awk '/^## \[/{n++} n==1' CHANGELOG.md | tail -n +2)

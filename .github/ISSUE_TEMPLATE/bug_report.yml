name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe what you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Click "Watch a region…"
        2. Select …
        3. …
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Alert mode
      options:
        - Stops
        - Starts
        - Any change
        - Not applicable
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Waiting Room version
      placeholder: "0.1"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: "macOS 15.1, MacBook Air M2"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots are welcome. Please blur anything private.
